# Rebuilds the page from fresh data and publishes it. If any step fails, the live page stays as it was
# and GitHub emails the account owner.
name: Update the site

on:
  schedule:
    - cron: '45 15 * * *' # 21:15 in India, after NSE publishes the day's reports
    - cron: '15 2 * * *' # 07:45 in India, after US markets close
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write
  pages: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: downloads-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: downloads-
      - run: npm run build
      # Saved even after a failure, so the next run doesn't repeat downloads that succeeded.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .cache
          key: downloads-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v5
      # GitHub pauses scheduled jobs after 60 days without activity in a project. This keeps it running.
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
